<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logga in · AirTag-karta</title><link rel="stylesheet" href="/static/app.css"><script defer src="/static/login.js"></script></head>
<body><header><span class="brand">◎</span><div><small>DIN PRIVATA ÖVERSIKT</small><h1>AirTag-karta</h1></div></header>
<main class="login-layout"><section class="dialog"><h2>Logga in</h2><p>Logga in med ditt appkonto. Apple-kontot ansluter du efteråt, inne i appen.</p>
<form id="login-form"><label for="username">Användarnamn</label><input id="username" name="username" autocomplete="username" maxlength="40" required autofocus>
<label for="password">Lösenord</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
<button id="login-button">Logga in</button><p id="login-error" role="alert"></p></form>
<p>Administratören skapar nya appkonton. Administratören loggar in som <b>admin</b> med containerns applösenord.</p></section></main></body></html>
