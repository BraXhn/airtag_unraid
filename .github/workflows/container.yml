name: Test, build and publish container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run local tests
        run: python -m pytest tests -q

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Choose image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build Linux amd64 image
        run: >-
          docker build --platform linux/amd64
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          --tag "$IMAGE:$GITHUB_SHA" .
      - name: Check exporter binary
        run: docker run --rm "$IMAGE:$GITHUB_SHA" export-findmy --help
      - name: Prepare and initialize emulated CoreADI without an Apple account
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --tmpfs /data:rw,uid=1000,gid=1000,mode=0700,size=2g \
            -e APP_PASSWORD=ci-pass-1234 \
            "$IMAGE:$GITHUB_SHA" python -c \
            'import mac_worker; mac_worker.ensure_library(); mac_worker.load_modules(); from adi_run import CoreADI; adi=CoreADI(); assert adi.initialize().ok; assert adi.is_machine_provisioned(-2).ret == -45061; print("Offline CoreADI initialization passed; no machine provisioned and no Apple login attempted")'
      - name: Start application without an Apple account
        run: |
          docker run -d --name airtag-smoke --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --tmpfs /data:rw,uid=1000,gid=1000,mode=0700 \
            -e APP_PASSWORD=ci-pass-1234 \
            "$IMAGE:$GITHUB_SHA"
          for attempt in $(seq 1 30); do
            if docker exec airtag-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=2)"; then
              exit 0
            fi
            sleep 2
          done
          docker logs airtag-smoke
          exit 1
      - name: Stop smoke test
        if: always()
        run: docker rm -f airtag-smoke || true
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
